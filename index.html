<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 기록</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#fbfbf9;
    --panel:#ffffff;
    --ink:#1b2430;
    --ink-soft:#5d6b7a;
    --rule:#e3e6ea;
    --rule-soft:#eef0f3;
    --seal:#b3372c;
    --seal-soft:#f7eae8;
    --sans:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
    --serif:"Nanum Myeongjo","Apple SD Gothic Neo",Georgia,serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#12161c;
      --panel:#181d25;
      --ink:#e6eaf0;
      --ink-soft:#8e9aa8;
      --rule:#2a323c;
      --rule-soft:#212832;
      --seal:#e0685a;
      --seal-soft:#2e1f1e;
    }
  }
  :root[data-theme="dark"]{
    --paper:#12161c;
    --panel:#181d25;
    --ink:#e6eaf0;
    --ink-soft:#8e9aa8;
    --rule:#2a323c;
    --rule-soft:#212832;
    --seal:#e0685a;
    --seal-soft:#2e1f1e;
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    -webkit-text-size-adjust:100%;
  }
  :focus-visible{outline:2px solid var(--seal);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

  /* ---------- 머리말 ---------- */
  .top{
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    padding:18px 26px;
    background:var(--panel);
    border-bottom:1px solid var(--rule);
  }
  .top h1{
    margin:0;
    font-family:var(--serif);
    font-size:23px;font-weight:700;letter-spacing:.01em;
  }
  .top .tally{
    font-family:var(--mono);font-size:12px;color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }
  .top .push{flex:1}
  .top .acts{display:flex;gap:8px}

  button{
    font-family:var(--sans);font-size:13.5px;
    cursor:pointer;border-radius:3px;
    border:1px solid var(--rule);
    background:var(--panel);color:var(--ink);
    padding:8px 14px;
    transition:border-color .15s, background .15s, color .15s;
  }
  button:hover{border-color:var(--ink-soft)}
  button.solid{
    background:var(--ink);border-color:var(--ink);
    color:var(--panel);font-weight:500;
  }
  button.solid:hover{filter:brightness(1.25)}
  button.quiet{border-color:transparent;color:var(--ink-soft);padding:8px 10px}
  button.quiet:hover{color:var(--seal);border-color:transparent}
  button.risk:hover{border-color:var(--seal);color:var(--seal)}

  /* ---------- 두 칸 배치 ---------- */
  .frame{
    display:grid;grid-template-columns:264px minmax(0,1fr);
    height:calc(100vh - 62px);min-height:560px;
  }
  @media (max-width:820px){
    .frame{grid-template-columns:1fr;height:auto;min-height:0}
    .index{border-right:0;border-bottom:1px solid var(--rule);max-height:44vh}
  }

  /* ---------- 왼쪽 색인 ---------- */
  .index{
    border-right:1px solid var(--rule);
    background:var(--panel);
    overflow-y:auto;
    padding:16px 14px 28px;
    display:flex;flex-direction:column;gap:14px;
  }
  .find{
    width:100%;padding:8px 11px;
    border:1px solid var(--rule);border-radius:3px;
    background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:13.5px;
  }
  .find::placeholder{color:var(--ink-soft)}
  .find:focus{outline:none;border-color:var(--seal)}

  .months{display:flex;flex-direction:column;gap:18px}
  .month{display:flex;flex-direction:column;gap:2px}
  .month > h2{
    margin:0 0 4px;padding-bottom:5px;
    border-bottom:1px solid var(--rule-soft);
    font-family:var(--mono);font-size:11px;font-weight:500;
    letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-soft);
  }

  .row{
    display:grid;grid-template-columns:26px minmax(0,1fr);
    gap:10px;align-items:baseline;
    padding:8px 9px;border-radius:3px;
    border-left:2px solid transparent;
    cursor:pointer;text-align:left;width:100%;
    background:none;border-top:0;border-right:0;border-bottom:0;
    font-family:var(--sans);
  }
  .row:hover{background:var(--paper);border-left-color:var(--rule)}
  .row[aria-current="true"]{background:var(--seal-soft);border-left-color:var(--seal)}
  .row .day{
    font-family:var(--mono);font-size:13px;color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }
  .row[aria-current="true"] .day{color:var(--seal)}
  .row .cap{min-width:0}
  .row .cap b{
    display:block;font-weight:500;font-size:13.5px;line-height:1.35;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .row .cap span{
    display:block;font-size:12px;color:var(--ink-soft);line-height:1.4;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .row.sample .cap b::after{
    content:"예시";
    font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
    color:var(--ink-soft);border:1px solid var(--rule);
    border-radius:2px;padding:1px 4px;margin-left:6px;vertical-align:1px;
  }
  .none{color:var(--ink-soft);font-size:13px;line-height:1.8;padding:10px 4px}

  /* ---------- 오른쪽 원고 ---------- */
  .sheet{
    overflow-y:auto;padding:26px 30px 40px;
    display:flex;flex-direction:column;gap:16px;
  }
  .stamp{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .stamp input[type=date],.stamp select{
    font-family:var(--mono);font-size:13px;
    padding:7px 9px;border:1px solid var(--rule);border-radius:3px;
    background:var(--panel);color:var(--ink);
  }
  .stamp select{font-family:var(--sans)}
  .stamp input[type=date]:focus,.stamp select:focus{outline:none;border-color:var(--seal)}
  .stamp input[type=date]:disabled,.stamp select:disabled{
    background:var(--paper);color:var(--ink-soft);
    border-color:var(--rule-soft);opacity:1;
  }
  .weekday{
    font-family:var(--mono);font-size:12px;color:var(--seal);
    letter-spacing:.1em;
  }
  .lockmark{
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;
    color:var(--ink-soft);border:1px solid var(--rule);
    border-radius:2px;padding:3px 7px;
  }

  .manuscript{
    border-left:2px solid var(--seal);
    padding-left:22px;
    display:flex;flex-direction:column;gap:12px;
    flex:1;
    transition:border-color .15s;
  }
  body.locked .manuscript{border-left-color:var(--rule)}
  body.locked .weekday{color:var(--ink-soft)}
  #heading{
    width:100%;border:0;background:transparent;color:var(--ink);
    font-family:var(--serif);font-size:26px;font-weight:700;
    line-height:1.3;padding:2px 0;
  }
  #heading:focus{outline:none}
  #heading::placeholder,#page::placeholder{color:var(--ink-soft);font-weight:400}
  #page{
    flex:1;min-height:340px;width:100%;max-width:64ch;resize:vertical;
    border:0;border-top:1px solid var(--rule-soft);
    background:transparent;color:var(--ink);
    font-family:var(--sans);font-size:15px;line-height:2;
    padding:14px 0 0;
  }
  #page:focus{outline:none}
  body.locked #heading,body.locked #page{cursor:default}

  .foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:4px}
  .note{
    margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-soft);
  }
  .note.warn{color:var(--seal)}
</style>
</head>
<body>
<header class="top">
  <h1>오늘의 기록</h1>
  <span class="tally" id="tally"></span>
  <span class="push"></span>
  <div class="acts">
    <button class="solid" id="compose">새 글</button>
  </div>
</header>

<div class="frame">
  <nav class="index" aria-label="기록 목록">
    <input class="find" id="find" type="search" placeholder="제목·내용 찾기" autocomplete="off">
    <div class="months" id="months"></div>
  </nav>

  <main class="sheet">
    <div class="stamp">
      <input type="date" id="when" aria-label="날짜">
      <span class="weekday" id="weekday"></span>
      <select id="feel" aria-label="기분">
        <option value="">기분 —</option>
        <option value="😊">😊 좋음</option>
        <option value="🙂">🙂 보통</option>
        <option value="😔">😔 가라앉음</option>
        <option value="😡">😡 화남</option>
        <option value="🥱">🥱 지침</option>
        <option value="🥳">🥳 신남</option>
      </select>
      <span class="lockmark" id="lockmark" hidden>읽기 전용</span>
    </div>

    <div class="manuscript">
      <input id="heading" placeholder="제목" autocomplete="off">
      <textarea id="page" placeholder="오늘 있었던 일을 적어보세요."></textarea>
    </div>

    <div class="foot">
      <button class="solid" id="keep">저장</button>
      <button class="solid" id="amend">수정</button>
      <button id="revert">취소</button>
      <button id="close">닫기</button>
      <button class="risk" id="drop">삭제</button>
      <span class="note" id="note"></span>
    </div>
  </main>
</div>

<script>
(function(){
  "use strict";

  var LOCAL_KEY = "oneuli-girok";
  var DAYS = ["일","월","화","수","목","금","토"];

  var el = function(id){ return document.getElementById(id); };
  var months = el("months"), tally = el("tally"), note = el("note");

  var entries = [];      // {id, when, feel, heading, page, edited}
  var openId = null;     // 펼쳐 놓은 기록의 id (새 글이면 null)
  var mode = "new";      // "new" 새로 쓰기 · "read" 읽기 전용 · "edit" 고치는 중
  var saveTimer = null;
  
  var SAMPLE = {
    id: "__sample__",
    when: iso(new Date()),
    feel: "🙂",
    heading: "첫 기록을 남기기 전에",
    page: "이건 앱이 어떻게 보이는지 알려주는 예시입니다.\n\n" +
          "위쪽 ‘새 글’을 누르면 빈 종이가 열립니다. 제목과 내용을 적고 저장하면\n" +
          "왼쪽 목록에 날짜순으로 쌓입니다.\n\n" +
          "왼쪽 목록에서 지난 글을 고르면 ‘읽기 전용’으로 열려서 실수로 고쳐지지\n" +
          "않습니다. 고치려면 아래 ‘수정’을 누르세요. 다 보고 나면 ‘닫기’입니다.\n\n" +
          "이 예시는 첫 기록을 저장하는 순간 사라집니다.",
    edited: 0,
    sample: true
  };

  /* ---------- 날짜 ---------- */
  function iso(d){
    return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
  }
  function weekdayOf(s){
    var p = String(s).split("-");
    if(p.length !== 3) return "";
    var d = new Date(+p[0], +p[1]-1, +p[2]);
    return isNaN(d) ? "" : DAYS[d.getDay()] + "요일";
  }

  /* ---------- 저장소 ---------- */
  function readLocal(){
    try {
      var raw = JSON.parse(localStorage.getItem(LOCAL_KEY));
      return Array.isArray(raw) ? raw : [];
    } catch(e){ return []; }
  }
  function writeLocal(){
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(entries)); }
    catch(e){ say("이 브라우저의 저장 공간이 가득 찼습니다", true); }
  }
  function persist(){ writeLocal(); }
  function forget(){ writeLocal(); }

  function say(msg, warn){
    note.textContent = msg;
    note.className = "note" + (warn ? " warn" : "");
    if(!msg) return;
    setTimeout(function(){
      if(note.textContent === msg){ note.textContent = ""; note.className = "note"; }
    }, 3200);
  }

  /* ---------- 모드 ---------- */
  function setMode(next){
    mode = next;
    var locked = (next === "read");

    el("heading").readOnly = locked;
    el("page").readOnly = locked;
    el("when").disabled = locked;
    el("feel").disabled = locked;
    document.body.classList.toggle("locked", locked);
    el("lockmark").hidden = !locked;

    el("keep").hidden   = locked;               // 저장  — 새 글 · 고치는 중
    el("amend").hidden  = (next !== "read");    // 수정  — 읽기 전용
    el("revert").hidden = (next !== "edit");    // 취소  — 고치는 중
    el("close").hidden  = (next === "new");     // 닫기  — 읽기 전용 · 고치는 중
    el("drop").hidden   = (next !== "read");    // 삭제  — 읽기 전용
  }

  function fill(e){
    el("when").value = e.when;
    el("feel").value = e.feel || "";
    el("heading").value = e.heading;
    el("page").value = e.page;
  }

  /* ---------- 편집 흐름 ---------- */
  function compose(){
    clearTimeout(saveTimer);
    openId = null;
    el("when").value = iso(new Date());
    el("feel").value = "";
    el("heading").value = "";
    el("page").value = "";
    setMode("new");
    paint();
    el("heading").focus();
  }

  function reveal(id){
    var e = find(id);
    if(!e) return;
    clearTimeout(saveTimer);
    openId = id;
    fill(e);
    setMode("read");
    paint();
  }

  function amend(){
    if(mode !== "read") return;
    setMode("edit");
    el("heading").focus();
    say("이제 고칠 수 있습니다");
  }

  function revert(){
    var e = find(openId);
    if(!e){ compose(); return; }
    clearTimeout(saveTimer);
    fill(e);
    setMode("read");
    paint();
    say("고치기를 취소했습니다");
  }

  function find(id){
    for(var i = 0; i < entries.length; i++) if(entries[i].id === id) return entries[i];
    return id === SAMPLE.id ? SAMPLE : null;
  }

  function keep(quiet){
    if(mode === "read") return;

    var heading = el("heading").value.trim();
    var page = el("page").value.trim();
    if(!heading && !page){
      if(!quiet) say("내용을 먼저 적어 주세요", true);
      return;
    }

    var e = openId ? find(openId) : null;
    if(!e || e.sample){
      e = { id: String(Date.now()) + Math.random().toString(36).slice(2,6) };
      entries.push(e);
      openId = e.id;
    }
    e.when = el("when").value || iso(new Date());
    e.feel = el("feel").value;
    e.heading = heading || "무제";
    e.page = page;
    e.edited = Date.now();

    persist();

    if(quiet){
      paint();
      say("자동 저장됨");
    } else {
      setMode("read");     // 저장하면 다시 잠긴다
      paint();
      say("저장했습니다");
    }
  }

  function drop(){
    if(!openId || openId === SAMPLE.id){ compose(); return; }
    var e = find(openId);
    if(!e) return;
    if(!confirm("‘" + e.heading + "’을(를) 지울까요? 되돌릴 수 없습니다.")) return;
    var id = e.id;
    entries = entries.filter(function(x){ return x.id !== id; });
    forget();
    compose();
    say("지웠습니다");
  }

  /* ---------- 목록 그리기 ---------- */
  function paint(){
    el("weekday").textContent = weekdayOf(el("when").value);
    tally.textContent = entries.length ? entries.length + "편" : "";

    var q = el("find").value.trim().toLowerCase();
    var pool = entries.length ? entries : [SAMPLE];
    var shown = pool.filter(function(e){
      return !q || (e.heading + " " + e.page).toLowerCase().indexOf(q) !== -1;
    }).sort(function(a,b){
      return a.when === b.when ? b.edited - a.edited : (a.when < b.when ? 1 : -1);
    });

    months.textContent = "";

    if(!shown.length){
      var none = document.createElement("p");
      none.className = "none";
      none.textContent = "‘" + el("find").value.trim() + "’과 맞는 기록이 없습니다.";
      months.appendChild(none);
      return;
    }

    var group = null, label = null;
    shown.forEach(function(e){
      var key = e.when.slice(0, 7);
      if(key !== label){
        label = key;
        group = document.createElement("section");
        group.className = "month";
        var h = document.createElement("h2");
        var p = key.split("-");
        h.textContent = p[0] + "년 " + (+p[1]) + "월";
        group.appendChild(h);
        months.appendChild(group);
      }
      group.appendChild(rowFor(e));
    });
  }

  function rowFor(e){
    var row = document.createElement("button");
    row.type = "button";
    row.className = "row" + (e.sample ? " sample" : "");
    if(e.id === openId) row.setAttribute("aria-current", "true");

    var day = document.createElement("span");
    day.className = "day";
    day.textContent = e.when.slice(8);

    var cap = document.createElement("span");
    cap.className = "cap";
    var b = document.createElement("b");
    b.textContent = (e.feel ? e.feel + " " : "") + e.heading;
    var s = document.createElement("span");
    s.textContent = e.page.replace(/\s+/g, " ").slice(0, 40) || "내용 없음";
    cap.appendChild(b);
    cap.appendChild(s);

    row.appendChild(day);
    row.appendChild(cap);
    row.addEventListener("click", function(){
      if(mode === "edit" && e.id !== openId &&
         !confirm("고치던 내용을 저장하지 않고 다른 기록을 열까요?")) return;
      reveal(e.id);
    });
    return row;
  }

  /* ---------- 내보내기 ---------- */
  function exportAll(downloads){
    if(!entries.length){ say("내보낼 기록이 없습니다", true); return; }
    var text = entries.slice().sort(function(a,b){
      return a.when < b.when ? -1 : (a.when > b.when ? 1 : a.edited - b.edited);
    }).map(function(e){
      return e.when + " " + weekdayOf(e.when) + (e.feel ? " " + e.feel : "") +
             "\n" + e.heading + "\n\n" + e.page + "\n\n" +
             "────────────────────\n";
    }).join("\n");

    downloads.save({ filename: "오늘의기록-" + iso(new Date()) + ".txt", data: text })
      .then(function(){ say("내려받았습니다"); })
      .catch(function(err){
        var code = err && err.code;
        if(code === "declined") return;
        if(code === "rate_limited"){ say("잠시 후 다시 눌러 주세요", true); return; }
        say("내보내기에 실패했습니다", true);
      });
  }

  /* ---------- 연결 ---------- */
  el("compose").addEventListener("click", function(){
    if(mode === "edit" && !confirm("고치던 내용을 저장하지 않고 새 글을 쓸까요?")) return;
    compose();
  });
  el("keep").addEventListener("click", function(){ keep(false); });
  el("amend").addEventListener("click", amend);
  el("revert").addEventListener("click", revert);
  el("close").addEventListener("click", function(){
    if(mode === "edit" && !confirm("고치던 내용을 저장하지 않고 닫을까요?")) return;
    compose();
  });
  el("drop").addEventListener("click", drop);
  el("find").addEventListener("input", paint);
  el("when").addEventListener("input", function(){
    el("weekday").textContent = weekdayOf(el("when").value);
  });

  ["heading","page","when","feel"].forEach(function(id){
    el(id).addEventListener("input", function(){
      if(mode === "read") return;          // 잠긴 동안에는 저장하지 않는다
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function(){ keep(true); }, 1500);
    });
  });

  document.addEventListener("keydown", function(ev){
    if((ev.metaKey || ev.ctrlKey) && ev.key === "s"){
      ev.preventDefault();
      if(mode === "read"){ amend(); return; }
      clearTimeout(saveTimer);
      keep(false);
    }
    if(ev.key === "Escape" && mode === "read") compose();
  });

  entries = readLocal();
  compose();

})();
</script>
</body>
</html>
